name: Deploy to EC2 via Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bigbite-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          # Read Vite variables from Github Secrets and pass to Dockerfile
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bigbite-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/bigbite-devops
            
            # Stop the host Nginx if it's still running, so Docker can use port 80
            sudo systemctl stop nginx || true
            sudo systemctl disable nginx || true
            
            # Aggressively clean old host-based node_modules and logs to free disk space
            rm -rf ~/bigbite-devops/node_modules ~/bigbite-devops/frontend/node_modules ~/bigbite-devops/backend/node_modules || true
            pm2 flush || true
            rm -rf ~/.pm2/logs/* || true
            sudo journalctl --vacuum-time=1d || true
            sudo apt-get clean || true
            
            # Pull the new docker-compose.yml configuration
            git pull origin main
            
            # Stop running containers so their images can be deleted
            sudo docker compose down || true
            
            # Wipe old images to free up disk space BEFORE pulling new ones
            sudo docker system prune -af --volumes
            
            # Print available disk space to verify
            df -h
            
            # Pull the completely built images from docker hub
            sudo docker compose pull
            
            # Start the new containers
            sudo docker compose up -d --remove-orphans


