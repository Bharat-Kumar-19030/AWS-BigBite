server {
    listen 80;
    server_name _; # You can replace _ with your domain name if you buy one

    # Serve the React Frontend
    location / {
        root /home/ubuntu/bigbite-devops/frontend/dist;
        index index.html index.htm;
        # This allows React Router to handle URLs without throwing a 404
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy the Node.js API
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Reverse Proxy Socket.io (since your backend uses it)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
